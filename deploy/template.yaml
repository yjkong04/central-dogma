AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Central Dogma live demo — Lambda API (Bedrock via IAM) + S3/CloudFront frontend.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          CENTRALDOGMA_STORE_BACKEND: file
          CENTRALDOGMA_EMBEDDER: bedrock
          CENTRALDOGMA_EMBEDDING_DIM: "1024"
          CENTRALDOGMA_GENERATOR: bedrock
          CENTRALDOGMA_ALLOWED_ORIGINS: !Ref AllowedOrigin
          CENTRALDOGMA_AWS_REGION: !Ref AWS::Region
      Policies:
        - Statement:
            - Effect: Allow
              Action: [ "bedrock:InvokeModel" ]
              Resource:
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ..
      DockerTag: latest

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls: { Rules: [ { ObjectOwnership: BucketOwnerEnforced } ] }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  ApiUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  SiteBucketName:
    Value: !Ref SiteBucket
  SiteUrl:
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteDistributionId:
    Value: !Ref SiteDistribution

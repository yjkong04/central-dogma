# Local Postgres + pgvector for Week 2 onward. Not needed for the demo store.
#   docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: centraldogma
      POSTGRES_PASSWORD: centraldogma
      POSTGRES_DB: centraldogma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centraldogma"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

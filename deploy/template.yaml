AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Central Dogma live demo — Lambda API (Bedrock via IAM) + S3/CloudFront frontend.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
  StoreBackend:
    Type: String
    Default: file
    AllowedValues: [file, aurora, demo, pgvector]

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          CENTRALDOGMA_STORE_BACKEND: !Ref StoreBackend
          CENTRALDOGMA_EMBEDDER: bedrock
          CENTRALDOGMA_EMBEDDING_DIM: "1024"
          CENTRALDOGMA_GENERATOR: bedrock
          CENTRALDOGMA_ALLOWED_ORIGINS: !Ref AllowedOrigin
          CENTRALDOGMA_AWS_REGION: !Ref AWS::Region
          CENTRALDOGMA_AURORA_CLUSTER_ARN: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}'
          CENTRALDOGMA_AURORA_SECRET_ARN: !Ref DbSecret
          CENTRALDOGMA_AURORA_DATABASE: centraldogma
          CENTRALDOGMA_UPLOADS_BUCKET: !Ref UploadsBucket
          CENTRALDOGMA_BATCHES_TABLE: !Ref BatchesTable
          CENTRALDOGMA_PAPERS_TABLE: !Ref PapersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [ "bedrock:InvokeModel" ]
              Resource:
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
        - Statement:
            - Effect: Allow
              Action: [rds-data:ExecuteStatement, rds-data:BatchExecuteStatement,
                       rds-data:BeginTransaction, rds-data:CommitTransaction,
                       rds-data:RollbackTransaction]
              Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}'
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref DbSecret
        - DynamoDBCrudPolicy:
            TableName: !Ref BatchesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PapersTable
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${UploadsBucket.Arn}/uploads/*"
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ..
      DockerTag: latest

  BatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: batch_id
          AttributeType: S
      KeySchema:
        - AttributeName: batch_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PapersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: batch_id
          AttributeType: S
        - AttributeName: paper_id
          AttributeType: S
      KeySchema:
        - AttributeName: batch_id
          KeyType: HASH
        - AttributeName: paper_id
          KeyType: RANGE

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST, PUT]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Central Dogma Aurora master credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"centraldogma"}'
        GenerateStringKey: password
        ExcludePunctuation: true
        PasswordLength: 24

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "16.9"
      DatabaseName: centraldogma
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      EnableHttpEndpoint: true          # RDS Data API
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0                   # auto-pause to zero
        MaxCapacity: 1

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls: { Rules: [ { ObjectOwnership: BucketOwnerEnforced } ] }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  ApiUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  SiteBucketName:
    Value: !Ref SiteBucket
  SiteUrl:
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteDistributionId:
    Value: !Ref SiteDistribution
  AuroraClusterArn:
    Value: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}'
  AuroraSecretArn:
    Value: !Ref DbSecret
  UploadsBucketName:
    Value: !Ref UploadsBucket
  BatchesTableName:
    Value: !Ref BatchesTable
  PapersTableName:
    Value: !Ref PapersTable
